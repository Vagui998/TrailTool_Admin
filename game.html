<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity WebGL Player | TrailTool</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        /* Ensure the container and canvas scale responsively */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents any body scroll */
        }
        #unity-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            overflow: hidden; /* Ensures no overflow within container */
            padding: 0; /* Removes any padding within container */
        }
        #unity-canvas {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
    </div>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type === 'error') div.style = 'background: red; padding: 10px;';
            else if (type === 'warning') div.style = 'background: yellow; padding: 10px;';
            setTimeout(() => {
                warningBanner.removeChild(div);
                updateBannerVisibility();
            }, 5000);
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/Buildv70.loader.js";
        var config = {
            dataUrl: buildUrl + "/Buildv70.data.unityweb",
            frameworkUrl: buildUrl + "/Buildv70.framework.js.unityweb",
            codeUrl: buildUrl + "/Buildv70.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Avans",
            productName: "TrailTool",
            productVersion: "3",
            showBanner: unityShowBanner,
        };

        // Adjust the canvas to fit container size
        function resizeCanvas() {
            canvas.style.width = "100%";
            canvas.style.height = "100%";
        }

        window.addEventListener("resize", resizeCanvas);

        // Initial resizing for mobile
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";
        }

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
                resizeCanvas(); // Ensure canvas is sized properly on load
            }).catch((message) => {
                alert(message);
            });
        };

        document.body.appendChild(script);

        document.addEventListener("fullscreenchange", () => {
            if (!document.fullscreenElement) {
                resizeCanvas(); // Reapply responsive sizing when exiting fullscreen
            }
        });
    </script>
</body>
</html>
